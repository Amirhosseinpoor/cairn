name: winlog
on: push
jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - shell: bash
        run: |
          cargo test --workspace --no-fail-fast > out.txt 2>&1 || true
          grep -E "^test .* FAILED|panicked at" -A4 out.txt | head -60 | while IFS= read -r l; do echo "::error::${l//$'\r'/}"; done
