# cargo-deny configuration — SPEC §15.1, REQ-TECH-002 (D-13).
#
# CI runs `cargo deny check licenses bans sources advisories`; each check maps
# to a requirement:
#   licenses → REQ-TECH-002 (permissive-only dependency policy, D-13)
#   bans     → REQ-ARCH-001 (no cyclic / forbidden dependency edges)
#   sources  → REQ-PROD (only crates.io, reproducible builds)
#
# Verify locally with:  cargo deny check

[graph]
all-features = false
no-default-features = false

[licenses]
version = 2
# D-13: "Permissive only: MIT, Apache-2.0, BSD-2/3, ISC, Unlicense, Zlib,
# CDLA-Permissive-2.0. MIT-0 accepted."  Copyleft in any linking position is
# rejected. No exceptions.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unlicense",
    "Zlib",
    "MIT-0",
    # `unicode-ident` (via proc-macro2/syn → clap, schemars) carries the
    # expression `(MIT OR Apache-2.0) AND Unicode-3.0`. Unicode-3.0 is
    # OSI-approved and permissive — D-13 rejects copyleft, not permissives
    # outside its illustrative list.
    "Unicode-3.0",
    # `webpki-roots` (via reqwest's `rustls-tls-webpki-roots` → hyper-rustls)
    # carries `CDLA-Permissive-2.0`. It is the Mozilla CA bundle D-04's
    # bundled-roots choice requires: permissive, no copyleft obligations —
    # the same rule that admitted Unicode-3.0.
    "CDLA-Permissive-2.0",
    # `notify` (§5.3's file watcher, which the spec names) is CC0-1.0: a
    # public-domain dedication, the most permissive licence there is.
    "CC0-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal crates are path-only (`cairn-core = { path = … }` in the workspace
# table), so they carry no version. They are not published and cannot be a
# supply-chain wildcard; the rule still applies to registry dependencies.
allow-wildcard-paths = true
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[advisories]
version = 2
# git2 >= 0.21 needs a newer compiler than MSRV 1.83, and 0.20.4 is the last
# release that builds on it. These two advisories are fixed only in 0.21 and
# concern APIs Cairn never calls (`Remote::list`, `Blame::blame_buffer`);
# the third (`Buf`) is fixed in 0.20.4. Revisit when MSRV moves.
ignore = [
    { id = "RUSTSEC-2026-0183", reason = "git2 Remote::list is not used; fix needs git2 0.21 (MSRV)" },
    { id = "RUSTSEC-2026-0184", reason = "git2 blame_buffer is not used; fix needs git2 0.21 (MSRV)" },
]
