[package]
name = "cairn-provider"
description = "Provider trait, adapters, retry, token accounting (SPEC 4.5, 4.6)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
cairn-core.workspace = true
cairn-sse.workspace = true
chrono.workspace = true
futures.workspace = true
rand.workspace = true
regex.workspace = true
reqwest.workspace = true
tokio.workspace = true
tracing.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
# `test-util` for `#[tokio::test(start_paused)]` (virtual time in backoff
# tests) — same pattern as `cairn-sse`; normal builds never see it.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
